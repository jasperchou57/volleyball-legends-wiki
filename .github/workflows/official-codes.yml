name: Official code validation (manual only)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-codes-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTOMATION_STATE_FILE: ${{ github.workspace }}/.state/state.json
      AUTOMATION_WORK_DIR: ${{ github.workspace }}/.run
      AUTOMATION_CHANNELS_FILE: ${{ github.workspace }}/automation/channels.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore validation state
        id: state
        run: node automation/state-branch.mjs load
      - name: Validate deterministic automation
        run: |
          node --test automation/test/*.test.mjs
          node scripts/check-codes.mjs
      - name: Read trusted announcements (no model or website writes)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node automation/cli.mjs prepare
      - name: Persist validation progress
        if: always() && steps.state.outcome == 'success'
        run: node automation/state-branch.mjs save
      - name: Save run summary
        if: always() && steps.state.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: official-codes-validation
          path: .run/summary.json
          retention-days: 30
